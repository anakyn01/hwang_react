spring.application.name=dog-backend

spring.datasource.url=jdbc:mysql://localhost:3306/finddog?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234
#콘솔에 실행되는 실제 sql문을 예쁘게 보여줌
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#이걸 빼먹으면 자동으로 ORM이 안됨
spring.jpa.hibernate.ddl-auto=update