<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Operators</title>
    <link rel="stylesheet" href="css/counter.css"/>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-12">
<h1 class="mt-4 mb-2">할당 연산자</h1>
<p>
+= <mark id="o1"></mark> 입니다 <br/>
-= <mark id="o2"></mark> 입니다 <br/>
*= <mark id="o3"></mark> 입니다 <br/>
/= <mark id="o4"></mark> 입니다 <br/>
%= <mark id="o5"></mark> 입니다 <br/>
**= <mark id="o6"></mark> 입니다 <br/>
++ 증가[증분]<mark id="o7"></mark> --감소<mark id="o8"></mark><br/>
</p>            
<h1 class="mt-4 mb-2">자바스크립트 연산자</h1>
<p>
할당연산자는 값을 = 할당합니다
덧셈 연산자는 값을 + 더합니다
곱셈 연산자는 값을 * 곱합니다
비교 연산자는 값을 >= 비교합니다 
</p>            
        </div>
    </div>
</div>

<script src="js/js.js"></script>
</body>
</html>
