<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또번호 생성기</title>
</head>
<body>
    <div class="">
        <label for="">고정수 (콤마로 구분)</label>
        <input type="text" id="fixedNumbers" placeholder="예 5, 12">
    </div>

    <div class="">
        <label for="">생성 조합 수 :</label>
        <select name="" id="combCount">
            <option value="1">1게임(일천원)</option>
            <option value="5">5게임(오천원)</option>
            <option value="10">10게임(일만원)</option>
        </select>
    </div>

    <br/>
    <button onclick="generateLotto()">
        번호 생성하기
    </button>

    <div class="" id="result" ></div>

    <script src="js/lotto.js"></script>
</body>
</html>
